name: Build NativePHP Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ PHP 8.3 + extensões
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, openssl, fileinfo, zip
          tools: composer:v2

      # 3️⃣ Node.js 22
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4️⃣ Composer
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # 5️⃣ NPM
      - name: Install NPM dependencies
        run: npm install

      # 6️⃣ Build frontend
      - name: Build frontend assets
        run: npm run build

      # 7️⃣ Criar .env e configurar NativePHP
      - name: Prepare environment file
        shell: powershell
        run: |
          Copy-Item .env.example .env
          php artisan key:generate

          # Versão vem do config/nativephp.php (fallback do .env.example)
          $versionLine = Select-String -Path "config/nativephp.php" -Pattern "NATIVEPHP_APP_VERSION',\s*'([^']+)"
          $appVersion = if ($versionLine) { $versionLine.Matches.Groups[1].Value } else { "1.0.4" }

          Add-Content .env "`nNATIVEPHP_RUNNING=true"
          Add-Content .env "NATIVEPHP_APP_ID=com.apostas.cavalo.app"
          Add-Content .env "NATIVEPHP_APP_VERSION=$appVersion"
          Add-Content .env "NATIVEPHP_APP_AUTHOR='Sistema Apostas'"
          Add-Content .env "NATIVEPHP_APP_DESCRIPTION='Sistema de Apostas de Cavalos'"
          Add-Content .env "NATIVEPHP_UPDATER_ENABLED=true"
          Add-Content .env "NATIVEPHP_UPDATER_PROVIDER=github"
          Add-Content .env "GITHUB_OWNER=wesleyvieira12"
          Add-Content .env "GITHUB_REPO=apostas_cavalos"
          Add-Content .env "GITHUB_PRIVATE=false"
          Add-Content .env "GITHUB_V_PREFIXED_TAG_NAME=true"
          Add-Content .env "GITHUB_RELEASE_TYPE=release"
          Add-Content .env "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}"

          Write-Host "=== .env NativePHP (versão $appVersion) ==="
          Get-Content .env | Select-String -Pattern "NATIVEPHP_|GITHUB_(OWNER|REPO|PRIVATE|RELEASE)"

      # 8️⃣ Limpar cache e preparar NativePHP
      - name: Prepare NativePHP
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan native:install --force

      # 9️⃣ Build + publish NativePHP Windows (gera a atualização)
      - name: Build and publish NativePHP Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php artisan native:publish win

      # 1️⃣0️⃣ DEBUG
      - name: Debug build output
        shell: powershell
        run: |
          Write-Host "===== ROOT ====="
          Get-ChildItem

          if (Test-Path nativephp) {
            Write-Host "===== nativephp ====="
            Get-ChildItem nativephp -Recurse
          }

          if (Test-Path build) {
            Write-Host "===== build ====="
            Get-ChildItem build -Recurse
          }

          if (Test-Path dist) {
            Write-Host "===== dist ====="
            Get-ChildItem dist -Recurse
          }

      # 1️⃣1️⃣ Upload (paths amplos)
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nativephp-windows-build
          path: |
            nativephp/**
            build/**
            dist/**
